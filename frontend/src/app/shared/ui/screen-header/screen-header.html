@if (backLink(); as link) {
  <a matIconButton [routerLink]="link" [attr.aria-label]="backLabel()">
    <mat-icon>arrow_back</mat-icon>
  </a>
} @else {
  <ng-content select="[leading]" />
}
<div class="title">
  @if (headingLevel() === 1) {
    <h1 class="heading">{{ title() }}</h1>
  } @else {
    <h2 class="heading">{{ title() }}</h2>
  }
  @if (detail()) {
    <span class="detail">{{ detail() }}</span>
  }
</div>
<ng-content />
