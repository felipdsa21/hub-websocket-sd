<h2 mat-dialog-title>Sair da conta?</h2>
<mat-dialog-content>
  @if (pending() === 1) {
    1 mensagem pendente ainda não foi confirmada e pode se perder se você sair.
  } @else {
    {{ pending() }} mensagens pendentes ainda não foram confirmadas e podem se perder se você sair.
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton [mat-dialog-close]="true">Sair</button>
</mat-dialog-actions>
