name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Reruns the checks and, on main or develop, the deploy.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only PRs cancel older runs, so every push to main and develop keeps its status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Both package.json files use npm 11's allowScripts; the version comes from packageManager.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npx cdk synth --all -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Generated data in docs/dados and the scripts aren't kept in Prettier's format.
      - run: npx prettier --check . "../docs/**/*.md" "../*.md"
      - run: npx ng test --watch=false
      - run: npm run build
      - if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/hub-websocket-sd-frontend/browser
          # Matches the longest a deploy can wait for approval.
          retention-days: 30

  # develop deploys dev; main deploys prod once approved in the prod environment.
  deploy:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      STACK: HubWebSocket-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      # The stack picks up the bundle from this path and publishes it with config.json.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/hub-websocket-sd-frontend/browser
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      # The logs of a public repository are open to anyone signed in, so the stage URLs
      # are hidden; they stay in the stack outputs.
      - run: |
          set -o pipefail
          npx cdk deploy "$STACK" --require-approval never 2>&1 \
            | sed -E 's#(https|wss)://[a-z0-9]+\.(cloudfront\.net|execute-api\.[a-z0-9-]+\.amazonaws\.com)#\1://***#g'
