name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Both package.json files use npm 11's allowScripts.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npx cdk synth --all -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Generated data in docs/dados and the scripts aren't kept in Prettier's format.
      - run: npx prettier --check . "../docs/**/*.md" "../*.md"
      - run: npx ng test --watch=false
      - run: npm run build
